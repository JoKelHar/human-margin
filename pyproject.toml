[project]
name = "mediekjop"
version = "0.1.0"
description = "Norwegian B2C media-buying analysis agent with AI-exhaustion detection (recommend-only)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.1",
    "pandas>=2.2",
    "numpy>=1.26",
    "pyyaml>=6.0",
]

# Heavier analysis/modelling dependencies are introduced in later phases so the
# Phase 1 install stays small and fast. Install with: uv sync --extra modeling
[project.optional-dependencies]
modeling = [
    "scipy>=1.13",
    "statsmodels>=0.14",
    "pymc>=5.16",
]
dashboard = [
    "streamlit>=1.37",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mediekjop"]

[tool.pytest.ini_options]
testpaths = ["tests"]
