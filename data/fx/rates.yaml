# =============================================================================
# FX rates for the Creative Approach Planner
#
# NOK per 1 unit of the given currency. The planner runs every calculation in
# NOK and displays in the user's currency, always showing the rate and its date.
#
# This file SHIPS with the repo so the planner works fully offline. Refresh it
# from Norges Bank's open exchange-rate data with:
#
#     uv run python scripts/refresh_fx.py
#
# A refresh sets `as_of` to the quote date and `is_fallback: false`. Until then
# these are labelled fallback values, not live rates.
# =============================================================================

as_of: 2026-11-01
source: "fallback (approximate; run scripts/refresh_fx.py to update from Norges Bank)"
is_fallback: true

# NOK per unit of currency.
rates:
  NOK: 1.0
  EUR: 11.70
  USD: 10.80
  GBP: 13.60
